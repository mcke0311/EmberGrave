<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERGRAVE — Data Editor</title>
<style>
  :root {
    --bg:#14131a; --panel:#1d1b25; --panel2:#262430; --line:#34313f; --ink:#e7e3da;
    --dim:#9a93a6; --accent:#d8924a; --accent2:#7fd8c0; --mod:#e8d060; --danger:#d05a4a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  #top { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  #top h1 { font-size:15px; margin:0; color:var(--accent); letter-spacing:.04em; }
  #top .sp { flex:1; }
  button { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:6px 12px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a140c; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--danger); }
  #status { color:var(--dim); font-size:12px; min-width:120px; }
  #tabs { display:flex; gap:4px; padding:6px 12px 0; background:var(--panel); border-bottom:1px solid var(--line); }
  .tab { padding:6px 14px; border:1px solid var(--line); border-bottom:none; border-radius:6px 6px 0 0;
    background:var(--panel2); color:var(--dim); cursor:pointer; }
  .tab.active { background:var(--bg); color:var(--accent2); border-color:var(--accent2); }
  .tab .badge { color:var(--mod); font-weight:700; margin-left:6px; }
  #main { display:flex; height:calc(100vh - 92px); }
  #list { width:300px; border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
  #search { width:100%; padding:8px 12px; background:var(--panel2); color:var(--ink); border:none;
    border-bottom:1px solid var(--line); outline:none; }
  .row { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; align-items:center; gap:8px; }
  .row:hover { background:var(--panel2); }
  .row.sel { background:var(--panel2); border-left:3px solid var(--accent); padding-left:9px; }
  .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .id { color:var(--dim); font-size:11px; }
  .row.dirty .nm::after { content:" ●"; color:var(--mod); }
  #editor { flex:1; overflow-y:auto; padding:16px 22px; }
  #editor h2 { margin:0 0 4px; color:var(--accent2); }
  #editor .sub { color:var(--dim); margin-bottom:14px; font-size:12px; }
  .field { display:flex; align-items:flex-start; gap:12px; padding:6px 0; border-bottom:1px solid #211f29; }
  .field label { width:160px; color:var(--dim); padding-top:5px; flex:none; }
  .field.mod label { color:var(--mod); }
  .field .ctl { flex:1; }
  .field input[type=text], .field input[type=number], .field textarea {
    width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:5px; padding:5px 8px; font:12px/1.4 ui-monospace, monospace; outline:none; }
  .field.mod input, .field.mod textarea { border-color:var(--mod); }
  .field textarea { min-height:64px; resize:vertical; white-space:pre; }
  .field .base { color:var(--dim); font-size:11px; margin-top:3px; }
  .hint { color:var(--dim); padding:40px; text-align:center; }
  #preview { display:flex; gap:6px; align-items:center; margin:6px 0 14px; flex-wrap:wrap; }
  .sw { width:22px; height:22px; border-radius:4px; border:1px solid #0006; }
  canvas.icon { image-rendering:pixelated; background:#0003; border:1px solid var(--line); border-radius:6px; }
  code { color:var(--accent2); }
</style>
</head>
<body>
<div id="top">
  <h1>⚒ EMBERGRAVE Data Editor</h1>
  <span id="status">loading…</span>
  <span class="sp"></span>
  <a href="loot.html" style="color:var(--accent2)">Items, affixes & drop chances ↗</a>
  <button id="btnReset" class="danger" title="Discard ALL overrides">Reset all</button>
  <button id="btnDownload" title="Download data_overrides.js">Download</button>
  <button id="btnSave" class="primary" title="Write js/data_overrides.js (needs serve.py)">Save</button>
</div>
<div id="tabs"></div>
<div id="main">
  <div id="list"><input id="search" placeholder="filter…" autocomplete="off"><div id="rows"></div></div>
  <div id="editor"><div class="hint">Pick a tab, then an entry to edit.</div></div>
</div>

<script src="js/utils.js?v=2"></script>
<script src="js/data.js?v=3&difficulty=2"></script>
<script src="js/unique_powers.js?v=1"></script>
<script src="js/sprite_manifest.js?v=1"></script>
<script src="js/sprite_assets.js?v=1"></script>
<script src="js/dataedit.js?v=2"></script>
</body>
</html>
