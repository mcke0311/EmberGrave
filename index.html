<link rel="apple-touch-icon" href="assets/ui/app/icon-180.png?v=2">

<body>
<div id="game">
  <canvas id="view" tabindex="-1"></canvas>

  <!-- Minimap -->
  <canvas id="minimap" width="220" height="160"></canvas>
  <div id="zonelabel"></div>

  <!-- Bottom HUD -->
  <div id="hud">
    <div class="orbwrap" id="orbHpWrap"><span class="orb-caption">VITALITY</span><canvas id="orbHp" width="132" height="132"></canvas><div class="orblabel" id="hpText"></div><span class="orb-foot">LIFE</span></div>
    <div id="hudmid">
      <div id="hudIdentity"><span id="hudClass"></span><span id="hudLevel"></span><span id="xpText"></span></div>
      <div id="xpbar" role="progressbar" aria-label="Experience"><div id="xpfill"></div></div>
      <div id="hudrow">
        <div class="hud-group"><span class="hud-group-label">Draughts</span><div id="beltBar"></div></div>
        <div class="hud-group active-group"><span class="hud-group-label">Combat</span><div class="active-skills">
          <button type="button" class="skillbtn" id="skillL" title="Assign left mouse skill"></button>
          <button type="button" class="skillbtn" id="skillR" title="Assign right mouse skill"></button>
        </div></div>
        <div class="hud-group"><span class="hud-group-label">Ready skills</span><div id="quickbar"></div></div>
      </div>
      <div id="hudbuttons">
        <button class="hbtn" data-panel="char"><kbd>C</kbd>Character</button>
        <button class="hbtn" data-panel="inv"><kbd>I</kbd>Inventory</button>
        <button class="hbtn" data-panel="skills"><kbd>T</kbd>Talents<span id="talentNotice" hidden></span></button>
        <button class="hbtn" data-panel="quest"><kbd>Q</kbd>Quests</button>
      </div>
    </div>
    <div class="orbwrap" id="orbMpWrap"><span class="orb-caption">SPIRIT</span><canvas id="orbMp" width="132" height="132"></canvas><div class="orblabel" id="mpText"></div><span class="orb-foot">AETHER</span></div>
  </div>

  <!-- Buff icons -->
  <div id="buffs"></div>

  <!-- Panels -->
  <div id="panelWorkspace">
  <div id="panelLeft" class="panel hidden"></div>
  <div id="panelRight" class="panel hidden"></div>
  <div id="panelCenter" class="panel hidden"></div>
  </div>

  <div id="tooltip" class="hidden"></div>
  <div id="tooltipCmp" class="hidden"></div>
  <div id="cursorItem" class="hidden"></div>

  <div id="msglog"></div>
  <div id="centerMsg" class="hidden"></div>

  <dialog id="deathScreen" aria-labelledby="deathTitle" aria-describedby="deathMessage">
    <div class="death-mark" aria-hidden="true">◆</div>
    <h2 id="deathTitle">YOU HAVE DIED</h2>
    <p id="deathMessage"></p>
    <button id="backToTown" class="menubtn" type="button" autofocus>Back to Town</button>
    <p id="deathStatus" role="status"></p>
  </dialog>

  <!-- Skill picker popup -->
  <div id="skillPick" class="hidden"></div>

  <!-- Debug console -->
  <div id="debug" class="hidden"></div>

  <!-- Escape menu -->
  <div id="escmenu" class="hidden"></div>

  <!-- Cinematic / ending overlay -->
  <div id="cinematic" class="hidden"></div>

  <!-- Title screen -->
  <div id="title" data-screen="main" role="dialog" aria-modal="true" aria-label="Embergrave main menu">
    <div class="title-backdrop" aria-hidden="true"></div>
    <div id="titleInner">
      <header class="title-brand">
        <h1>EMBERGRAVE</h1>
        <h2>The Sunderstone Saga</h2>
      </header>
      <div id="titleMenu"></div>
    </div>
  </div>
</div>
