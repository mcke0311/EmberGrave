<!doctype html><html lang="en"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel and quest sound review</title>
<style>body{margin:0;padding:40px;background:#131a23;color:#dacba9;font:16px/1.6 Georgia,serif}main{max-width:850px;margin:auto}h1{font-weight:normal}p{color:#a6b7c5}button,select{background:#283440;border:1px solid #8c7958;color:#eadabc;padding:12px 16px;cursor:pointer}button:focus-visible{outline:2px solid #ace1f3}section{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid #6d7c8540}small{display:block;color:#8a9fac}header{margin-bottom:25px}label{margin-right:20px}input{accent-color:#cab079}#state{color:#a5d9c7}@media(max-width:600px){body{padding:20px}section{grid-template-columns:1fr 1fr}section>div{grid-column:1/-1}}</style></head><body><main>
<h1>The sound of the road</h1><p>Compare the former synthesizer cues with the recorded material mixes. This page uses no hero or save data.</p>
<header><button id="enable">Enable sound</button> <span id="state">Sound is off</span></header>
<p><label>Effects <input id="effects" type="range" min="0" max="1" step=".05" value=".9"></label><label>Master <input id="master" type="range" min="0" max="1" step=".05" value=".8"></label></p>
<p><label>Background <select id="music"><option value="">Quiet</option><option value="frosthaven">Frosthaven</option><option value="fallenNorth">The Fallen North</option></select></label></p>
<div id="cues"></div></main><script src="js/audio.js"></script><script>
const cues=[['portalOpen','Portal opening','A gathering breath and crystalline seam.','portal'],['teleportTravel','Teleport travel','An arcane rush with a low arrival resonance.','shrine'],['questAccepted','Quest accepted','Parchment, latch and a restrained metallic accent.','quest'],['questReady','Objectives complete','A short cue for the return to a quest giver.','quest'],['questCompleted','Quest reward claimed','A fuller rising resolution with room to decay.','quest'],['questProgress','Quest progress','A small material cue for discoveries and rescues.','quest']];
for(const[id,title,desc,old]of cues){const section=document.createElement('section');const heading=document.createElement('div');heading.textContent=title;const small=document.createElement('small');small.textContent=desc;heading.append(small);section.append(heading);for(const[name,label]of[[old,'Former sound'],[id,'New sound']]){const b=document.createElement('button');b.textContent=label;b.disabled=true;b.onclick=()=>Sfx.play(name);section.append(b);}document.getElementById('cues').append(section);}
document.getElementById('enable').onclick=async()=>{await Sfx.init();await Sfx.loadInteractionSounds();document.querySelectorAll('section button').forEach(b=>b.disabled=false);document.getElementById('state').textContent=Sfx.interactionStats.loaded+' cues ready';};
document.getElementById('effects').oninput=e=>Sfx.setVol('sfx',+e.target.value);document.getElementById('master').oninput=e=>Sfx.setVol('master',+e.target.value);
document.getElementById('music').onchange=e=>e.target.value?Sfx.music(e.target.value):Sfx.stopMusic();
</script></body></html>
