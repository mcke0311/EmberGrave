<!doctype html><html lang="en"><meta charset="utf-8"><base href="../"><title>Embergrave — Terrain blending</title>
<style>body{margin:0;background:#101619;color:#dddfcf;font:14px/1.6 system-ui}header{padding:25px 4vw;background:#1d282b}h1{font:30px Georgia;margin:0}main{padding:20px 4vw}button{font:inherit;background:#344343;color:#f4dfb0;border:1px solid #736849;padding:8px 14px;cursor:pointer}#result{color:#a5d2ae}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}article{background:#202a2b;padding:12px}canvas{width:100%;display:block}h2{font:20px Georgia;margin:5px 0}#focus{margin-bottom:30px}#focus[hidden]{display:none}#focus canvas{max-width:1200px}</style>
<header><h1>The lands beyond town</h1><p>Continuous ground materials, worn paths and soft hazard edges across every wilderness and dungeon.</p><p id="result">Checking terrain…</p><a href="tests/town_redesign.html" style="color:#ebca89">Review town residents</a> · <a href="tests/level_runtime.html" style="color:#ebca89">Walk through the levels</a></header>
<main><section id="focus" hidden><h2 id="title"></h2><p id="detail"></p><canvas id="scene" width="1200" height="720"></canvas></section><section id="gallery" aria-label="All level terrain"></section></main>
<script src="js/utils.js"></script><script src="js/data.js?v=14"></script><script src="js/sprite_manifest.js?v=9"></script><script src="js/sprite_assets.js?v=8"></script><script src="js/mapgen.js?v=6"></script><script src="js/level_terrain.js?v=6"></script>
<script>
(async()=>{
 const out=document.getElementById('result');let checks=0;const ok=(v,msg)=>{checks++;if(!v)throw Error(msg)};
 try{
  await SpriteAssets.loadBundle('world');
  const source=await fetch('js/game.js',{cache:'no-store'}).then(r=>r.text()),a=source.indexOf('    /* ---- floors ---- */'),b=source.indexOf('    /* ---- ground items:',a);
  const draw=new Function('ctx','m','cam','tx0','tx1','ty0','ty1','inView','EH','MASSIF_THEMES',"LevelTerrain.beginFrame(m);try {"+source.slice(a,b)+"} finally {LevelTerrain.endFrame();}");
  const ids=Object.keys(DATA.ZONES).filter(id=>!['town','camp'].includes(DATA.ZONES[id].kind)),scenes=[];
  const terrainThemes=new Set(['fields','forest','snowwild','marsh','desert','hellwild']);
  const wait=()=>new Promise(r=>requestAnimationFrame(r));
  function render(canvas,scene){
   const {m,x,y}=scene,ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
   ctx.clearRect(0,0,w,h);const cam={x:U.isoX(x+.5,y+.5)-w/2,y:U.isoY(x+.5,y+.5)-h/2};
   draw(ctx,m,cam,Math.max(0,x-25),Math.min(m.w-1,x+25),Math.max(0,y-25),Math.min(m.h-1,y+25),(px,py)=>px>-70&&px<w+70&&py>-100&&py<h+100,14,terrainThemes);
  }
  function focus(scene){document.getElementById('focus').hidden=false;document.getElementById('title').textContent=scene.m.zone.name;document.getElementById('detail').textContent=`${scene.m.zone.theme} · ${scene.hazards.join(', ')||'ground and paths'} · original elevation and collision grid`;render(document.getElementById('scene'),scene);document.getElementById('focus').scrollIntoView({behavior:'instant'});}
  for(const id of ids){
   await SpriteAssets.loadBundle('zone:'+id);const m=MapGen.generate(id,12345),before=JSON.stringify([Array.from(m.walls),Array.from(m.floor),Array.from(m.elev),Array.from(m.hazard),Array.from(m.blocked)]);
   let best={score:-Infinity,x:Math.floor(m.w/2),y:Math.floor(m.h/2)};
   for(let y=8;y<m.h-8;y+=3)for(let x=8;x<m.w-8;x+=3){let score=0;
    for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const i=x+dx+(y+dy)*m.w;score+=m.walls[i]?-2:1;if(m.hazard[i])score+=2;if(m.floor[i]>=4)score+=.2;if(m.elev[i]!==m.elev[i+1])score+=.8;}
    if(score>best.score)best={score,x,y};
   }
   const scene={m,x:best.x,y:best.y,hazards:[...new Set(m.hazard)].filter(Boolean).map(n=>DATA.HAZARDS[n].name)};scenes.push(scene);
   const card=document.createElement('article'),title=document.createElement('h2'),preview=document.createElement('canvas'),button=document.createElement('button');title.textContent=m.zone.name;preview.width=840;preview.height=480;button.textContent='Inspect '+m.zone.name;button.onclick=()=>focus(scene);card.append(title,preview,button);document.getElementById('gallery').append(card);render(preview,scene);
   ok(before===JSON.stringify([Array.from(m.walls),Array.from(m.floor),Array.from(m.elev),Array.from(m.hazard),Array.from(m.blocked)]),id+' renderer changed gameplay geometry');
   // Flat 26x26 floors cross both axes of two chunk boundaries. Probe all
   // joins at a fractional camera offset and compare integer camera movement.
   const w=26,h=26,flat={id,zone:m.zone,w,h,floor:new Uint8Array(w*h),walls:new Uint8Array(w*h),hazard:new Uint8Array(w*h),elev:new Uint8Array(w*h)};
   const probe=document.createElement('canvas');probe.width=1800;probe.height=950;const pc=probe.getContext('2d',{willReadFrequently:true});
   function sample(shift){LevelTerrain.beginFrame(flat);try{pc.clearRect(0,0,probe.width,probe.height);for(let y=0;y<h;y++)for(let x=0;x<w;x++)LevelTerrain.drawTile(pc,flat,x,y,U.isoX(x+.5,y+.5)+850.35+shift,U.isoY(x+.5,y+.5)+30.35);return pc.getImageData(0,0,probe.width,probe.height).data;}finally{LevelTerrain.endFrame();}}
   const first=sample(0),second=sample(7);
   for(let y=1;y<25;y++)for(let x=1;x<25;x++)for(const [dx,dy] of [[0,0],[.5,0],[0,.5],[.5,.5]]){
    const px=Math.round(U.isoX(x+.5+dx,y+.5+dy)+850.35),py=Math.round(U.isoY(x+.5+dx,y+.5+dy)+30.35),i=(px+py*probe.width)*4,j=i+28;
    ok(first[i+3]>=250,id+' transparent ground seam at '+x+','+y+' alpha='+first[i+3]);
    ok(first.slice(i,i+4).every((v,k)=>Math.abs(v-second[j+k])<=1),id+' camera changed world texture at '+x+','+y);
   }
   out.textContent=`Checking ${scenes.length}/${ids.length} levels · ${checks} checks passed`;await wait();
  }
  ok(scenes.length===ids.length,'Some non-town levels were not reviewed');focus(scenes.find(s=>s.m.id==='weeping_marsh'));
  out.textContent=`PASS · ${checks} checks across all ${ids.length} wilderness and dungeon maps. Ground coverage, camera stability and unchanged gameplay geometry.`;document.body.dataset.testStatus='passed';
 }catch(e){out.textContent='FAIL · '+e.stack;document.body.dataset.testStatus='failed';}
})();
</script></html>
