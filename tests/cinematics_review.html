<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embergrave — cinematic direction review</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#0b1017;color:#e8dfcf;font:14px/1.5 system-ui}
main{max-width:1600px;margin:auto;padding:18px}h1{font:28px Georgia;margin:0 0 8px}p{color:#b5bcc5;margin:6px 0 16px}
fieldset{border:1px solid #4c4652;padding:12px;margin-bottom:12px;border-radius:5px}
button,select{min-height:42px;padding:8px 12px;margin:3px;background:#202936;color:#ede4d3;border:1px solid #716756;border-radius:3px}
button:hover{background:#334154}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f1d593;outline-offset:2px}
label{display:inline-flex;align-items:center;gap:6px;margin:5px 9px 5px 0}input[type=range]{width:min(600px,65vw)}
#host{display:grid;gap:12px}#host.comparing{grid-template-columns:repeat(2,minmax(0,1fr))}
section>h2{font:17px Georgia;margin:5px 0 8px}iframe{display:block;border:1px solid #665744;width:100%;height:720px;background:#05080b}
#host.comparing iframe{height:auto;aspect-ratio:16/9}
#status{white-space:pre-wrap;font:13px/1.5 system-ui;color:#c3c8d0;min-height:42px;margin:10px 0}
#shotList{display:flex;flex-wrap:wrap;gap:4px}#shotList button{min-height:32px;font-size:12px}
@media(max-width:800px){main{padding:10px}#host.comparing{grid-template-columns:1fr}iframe{height:min(720px,65vh)}h1{font-size:23px}}
</style>
<main><h1>The Sunderstone Saga — directed live scenes</h1>
<p>Isolated heroes and in-memory saves. Compare the original staging, inspect contacts, or watch a complete scene.</p>
<fieldset id="controls" disabled><legend>Scene review</legend>
<select id="scene" aria-label="Scene"></select><select id="hero" aria-label="Hero class"></select>
<select id="form" aria-label="Wildkeeper form"><option value="">Human form</option><option value="form_fang">Fang</option><option value="form_brute">Brute</option><option value="form_stone">Stone</option><option value="form_apex">Apex</option></select>
<select id="equipment" aria-label="Equipment"><option value="starter">Starter gear</option><option value="veteran">Veteran gear</option><option value="mythic">Mythic gear</option></select><br>
<button id="play">Play scene</button><button id="pause">Pause / resume</button><button id="advance">Advance 5 seconds</button><button id="step">Step one frame</button><button id="skip">Skip</button>
<label><input id="reduced" type="checkbox">Reduced motion</label><label><input id="missing" type="checkbox">Missing asset fallback</label>
<label><input id="captions" type="checkbox" checked>Show captions</label><label><input id="compare" type="checkbox">Compare original</label><br>
<label>Timeline <input id="timeline" type="range" min="0" max="35" step="0.033333" value="0"><output id="timeLabel">0.00 s</output></label>
<div id="shotList" aria-label="Shot navigation"></div></fieldset>
<div id="status" role="status">Loading the isolated game…</div><div id="host"></div></main>
<script type="module">
const store=new Map();window.cinematicReviewStore=store;const wait=ms=>new Promise(r=>setTimeout(r,ms));
const $=id=>document.getElementById(id),status=$('status');let paused=false,baseline=null,after=null;
const views=()=>[after,...($('compare').checked?[baseline]:[])].filter(Boolean);
async function boot(original=false){
 let html=await fetch('../index.html',{cache:'no-store'}).then(r=>r.text());
 if(original){
  html=html.replace(/<script src="js\/cinematic_presentation[^"]*"[^>]*><\/script>/,'');
  html=html.replace(/js\/cinematic_scenes.js\?[^"]+/, 'tests/fixtures/cinematics_before/cinematic_scenes.js');
  html=html.replace(/css\/cinematics.css\?[^"]+/, 'tests/fixtures/cinematics_before/cinematics.css');
  let js=await fetch('fixtures/cinematics_before/cinematics.js').then(r=>r.text());
  js=js.replace('return {request,tick,cancel','return {seek:time=>{if(!session?.ready||session.fallback)return false;session.time=Math.max(0,Math.min(session.d.duration-.001,time));session.soundIndex=session.d.sounds.filter(c=>c.at<=session.time).length;updatePresentation(session);updateCaption(session);return true;},request,tick,cancel');
  html=html.replace(/<script src="js\/cinematics.js\?[^"]*"[^>]*><\/script>/, '<script>'+js+'<\/script>');
 }
 const key=original?'cinematicBeforeStore':'cinematicReviewStore';if(original)window[key]=new Map();
 const injection='<base href="'+new URL('../index.html',location.href)+'"><style>.review-no-captions .cine-caption{visibility:hidden}</style><script>const store=parent.'+key+';Object.defineProperty(window,"localStorage",{value:{get length(){return store.size},key:i=>[...store.keys()][i]??null,getItem:k=>store.get(k)??null,setItem:(k,v)=>store.set(String(k),String(v)),removeItem:k=>store.delete(k)}});<\/script>';
 const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=original?'Original presentation':'Directed presentation';
 const frame=document.createElement('iframe');frame.title=heading.textContent;section.append(heading,frame);$('host').append(section);
 frame.srcdoc=html.replace('<head>','<head>'+injection);await new Promise(r=>frame.onload=r);
 const win=frame.contentWindow;for(let i=0;i<500&&!win.document.querySelector('#titleMenu button');i++)await wait(40);
 const game=win.eval('Game'),cine=win.eval('Cinematics'),catalog=win.eval('CinematicScenes'),ui=win.eval('UI');
 win.eval('Sfx').setVol('master',original?0:.65);
 await game.newGame('Cinematic Review','vanguard',false);
 await (await import('./completed_hero_fixture.mjs')).loadCompletedHero(game);game.state.seed=7136411;ui.closeAll();game.debugFlags.god=true;
 return {game,cine,catalog,frame,win,section};
}
function selected(){return after.catalog.get($('scene').value);}
function navigation(){
 const d=selected();$('timeline').max=d.duration;$('shotList').replaceChildren();
 for(const shot of d.shots){const b=document.createElement('button');b.textContent=shot.at+'s · '+shot.id;b.onclick=()=>seek(shot.at+.2);$('shotList').append(b);}
 const url=new URL(location.href);url.searchParams.set('scene',d.id);history.replaceState(null,'',url);
}
async function appearance(view){
 let cls=$('hero').value;const form=$('form').value;if(form)cls='wildkeeper';
 if(view.game.state.player.classId!==cls){const p=view.game.coop.makeHero('Cinematic Review',cls);Object.assign(p,{x:view.game.state.player.x,y:view.game.state.player.y});view.game.state.player=p;view.game.state.players=[p];}
 const p=view.game.state.player;p.buffs=p.buffs.filter(b=>!b.id?.startsWith('form_'));if(form)p.buffs.push({id:form,t:999,stacks:1});
 const tier=$('equipment').value==='mythic'?7:$('equipment').value==='veteran'?4:null;
 if(tier){
  const weapon={vanguard:'sword',emberwitch:'wand',gravebinder:'wand',wildkeeper:'staff2h',veilranger:'bow2h'}[cls];
  for(const [slot,id]of Object.entries({main:weapon+'_t'+tier,head:'helm_t'+tier,chest:'chest_t'+tier,gloves:'gloves_t'+tier,boots:'boots_t'+tier,belt:'belt_t'+tier,amulet:'amulet_t'+tier,...(cls==='vanguard'?{off:'shield_t'+tier}:{})}))p.equip[slot]={...(p.equip[slot]||{}),baseId:id};
 }else p.equip=Object.fromEntries(Object.entries(view.win.eval('DATA').PLAYER_STARTER_LOADOUTS[cls]).map(([slot,baseId])=>[slot,{baseId}]));
 await view.game.coop.prepareHero(p);
}
function captions(){for(const v of [after,baseline].filter(Boolean))v.win.document.body.classList.toggle('review-no-captions',!$('captions').checked);}
async function play(){
 paused=false;
 for(const v of views()){v.cine.cancel('review restart');await appearance(v);v.cine.request($('scene').value,{replay:true,reducedMotion:$('reduced').checked,missingAsset:$('missing').checked});}
 $('timeline').value=0;captions();
}
async function seek(t){
 if(!after.cine.state)await play();
 for(const v of views()){for(let i=0;i<500&&!v.cine.state?.ready;i++)await wait(30);v.cine.setPaused(true);v.cine.seek(t);}paused=true;
 $('timeline').value=t;captions();
}
try{
 after=await boot();
 for(const d of after.catalog.all){const o=document.createElement('option');o.value=d.id;o.textContent=(d.ending?'Ending':'Act '+d.act)+' · '+d.title+' · '+d.duration+'s';$('scene').append(o);}
 const initialScene=new URLSearchParams(location.search).get('scene');if(after.catalog.get(initialScene))$('scene').value=initialScene;
 for(const [id,name]of [['vanguard','Vanguard'],['emberwitch','Ember Witch'],['gravebinder','Gravebinder'],['veilranger','Veil Ranger'],['wildkeeper','Wildkeeper']]){const o=document.createElement('option');o.value=id;o.textContent=name;$('hero').append(o);}
 $('scene').onchange=navigation;$('play').onclick=play;
 $('pause').onclick=()=>{paused=!paused;for(const v of views())v.cine.setPaused(paused);};
 $('advance').onclick=()=>seek((after.cine.state?.time||0)+5);
 $('step').onclick=()=>seek((after.cine.state?.time||0)+1/30);
 $('skip').onclick=()=>{for(const v of views())v.win.document.querySelector('.cine-skip')?.click();};
 $('timeline').oninput=()=>seek(Number($('timeline').value));$('captions').onchange=captions;
 $('form').onchange=()=>{if($('form').value)$('hero').value='wildkeeper';};
 $('hero').onchange=()=>{if($('hero').value!=='wildkeeper')$('form').value='';};
 $('compare').onchange=async()=>{
  if($('compare').checked){if(!baseline){status.textContent='Loading original presentation…';baseline=await boot(true);}baseline.section.hidden=false;$('host').classList.add('comparing');await appearance(baseline);baseline.cine.cancel('review comparison');baseline.cine.request($('scene').value,{replay:true,reducedMotion:$('reduced').checked,missingAsset:$('missing').checked});for(let i=0;i<500&&!baseline.cine.state?.ready;i++)await wait(30);baseline.cine.seek(after.cine.state?.time||0);baseline.cine.setPaused(paused);}
  else{baseline?.cine.cancel('comparison closed');if(baseline)baseline.section.hidden=true;$('host').classList.remove('comparing');}captions();
 };
 $('controls').disabled=false;navigation();
 window.cinematicReview={...after,seek,play,get baseline(){return baseline;}};
 setInterval(()=>{const s=after.cine.state;if(s){$('timeline').value=s.time;$('timeLabel').textContent=s.time.toFixed(2)+' / '+s.duration+' s';status.textContent=s.fallback?'Missing artwork: transcript fallback.':(s.shot||'Preparing scene…')+' · '+(s.stage||'loading')+(paused?' · paused':'');}else status.textContent='Ready. Choose one of the 20 scenes. Saves remain isolated.';},100);
}catch(e){status.textContent=e.stack;throw e;}
</script></html>
