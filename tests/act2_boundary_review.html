async function profile(){

    if(!p.path)throw Error('No walking route '+zone+'/'+ro.from+'/'+ro.to);
    for(let step=0;step<15000&&p.path;step++){const x=p.x,y=p.y;p.moveAlong(1/60,4.5,map,[]);distance+=Math.hypot(p.x-x,p.y-y);}
    if(Math.hypot(p.x-to.x,p.y-to.y)>.8)throw Error('Stalled walking route '+zone+'/'+ro.from+'/'+ro.to);
   }
   rows.push({zone,from:ro.from,to:ro.to,reverse,distance});await raf();
  }
 }
 await record('walking.json',{report:{status:'PASS',routes:rows}});document.body.dataset.testStatus='passed';el('status').textContent='PASS � '+rows.length+' route walks';controls(true);
}
async function action(fn){if(busy)return;busy=true;try{await fn();}catch(e){error(e);}finally{busy=false;}}
async function stageEnemy(id=el('enemy').value){
 el('enemy').value=id;
 if(id==='mire_mother')el('zone').value='ritual_site';
 await load();const s=game.state,n=map.act2?.landmarks.find(n=>n.id==='nave'||n.id==='brood'||n.id==='basin')||reference.act2.landmarks[1];
 s.monsters=[];s.projectiles=[];s.fx=[];const at=nearest(id==='mire_mother'?{x:map.bossArena.cx,y:map.bossArena.cy}:n);stagedEnemy=new api.Monster(id,at.x,at.y,{elite:el('variant').value==='elite'});s.monsters=[stagedEnemy];
 if(stagedEnemy.encounter){stagedEnemy.encounter.phase=+el('phase').value;stagedEnemy.encounter.setArt();}
 const p=nearest({x:at.x+5,y:at.y});game.__act2.place(p.x,p.y);stagedEnemy.aggro=true;
 const abilities=stagedEnemy.encounter?['natural','bile','grasp']:stagedEnemy.beacon?['summon']:['natural',...(stagedEnemy.def.projectile?['bolt']:['melee'])];
 if(!stagedEnemy.encounter&&!stagedEnemy.beacon)for(const [field,id] of [['summons','summon'],['volley','volley'],['slam','slam'],['teleports','blink'],['charge','lunge'],['leap','dive'],['detonateAllies','sacrifice'],['meteorRain','requiem'],['deathBurst','rupture']])if(stagedEnemy.def[field])abilities.push(id);
 el('ability').replaceChildren(...abilities.map(id=>new Option(id==='natural'?'Natural combat':id,id)));game.__act2.render();
 el('status').textContent=stagedEnemy.name+' · '+(stagedEnemy.act2Combat?'Act 2 combat profile':'Original behavior')+' · '+stagedEnemy.hp+' life';
}
async function previewAbility(ability=el('ability').value,autoplay=true){
 if(!stagedEnemy||stagedEnemy.dead)await stageEnemy();const m=stagedEnemy,c=m.act2Combat,p=game.state.player;
 if(ability==='death'){m.die(p);playing=autoplay;return;}
 if(m.encounter){m.encounter.active=true;m.encounter.phase=+el('phase').value;m.encounter.setArt();if(ability!=='natural')m.encounter.start(ability,p);playing=autoplay;return;}
 if(!c){if(m.beacon)m.beaconCd=0;playing=autoplay;return;}
 c.cancel();game.state.projectiles=[];for(const k in c.cooldowns)c.cooldowns[k]=999;
 const near=nearest({x:m.x+(ability==='melee'||ability==='slam'?1:5),y:m.y});game.__act2.place(near.x,near.y);
 if(ability==='natural')for(const k in c.cooldowns)c.cooldowns[k]=0;
 else if(ability==='bolt'||ability==='volley')c.bolt(p,ability==='volley');
 else if(ability==='melee')c.melee(p);
 else if(ability==='summon')c.summon();
 else if(ability==='requiem')c.requiem(p);
 else if(ability==='sacrifice'){for(let i=0;i<3;i++)c.spawn('drowned_dead',m.x+Math.cos(i*2)*2,m.y+Math.sin(i*2)*2);c.sacrifice();}
 else if(ability==='rupture')m.die(p);
 else{c.cooldowns[ability]=0;c.act(1/60,p,map);}
 playing=autoplay;el('play').textContent=playing?'Pause encounter':'Play encounter';game.__act2.render();
}
async function captureEnemies(){
 const rows=[];for(const width of [1920,3840])for(const id of [...el('enemy').options].map(o=>o.value)){
  el('width').value=width;el('enemy').value=id;await stageEnemy(id);
  for(const ability of [...el('ability').options].map(o=>o.value).filter(v=>v!=='natural')){
   await stageEnemy(id);await previewAbility(ability,false);
   for(let i=0;i<12;i++){game.__act2.update(1/60);game.__act2.updateCamera(1/60);}
   await capture(`enemy_${id}_${ability}_${width}.webp`);rows.push({id,ability,width});await raf();
  }
 }
 await record('enemy_captures.json',{report:{status:'PASS',rows}});el('status').textContent='PASS · '+rows.length+' enemy ability captures';
}

el('capture').onclick=()=>action(async()=>{await capture();el('status').textContent='Scene image saved in tests/qa/'+(params.has('enemyReview')?'act2_enemies':'act2_redesign')+'.';});el('captureAll').onclick=()=>action(captureAll);el('profile').onclick=()=>action(profile);
let previous=performance.now();function tick(now){const dt=Math.min(.05,(now-previous)/1000)*+el('speed').value;previous=now;if(playing&&!busy&&game){try{game.__act2.update(dt);game.__act2.updateCamera(dt);game.__act2.render();frameStatus();}catch(e){playing=false;error(e);}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
try{await load();if(params.has('qaEnemies'))await action(captureEnemies);else if(params.has('enemy'))await action(()=>stageEnemy());else if(params.has('walkAll'))await action(walkAll);else if(params.has('qa'))await action(async()=>{await captureAll();await profile();});else if(params.has('captureAll'))await action(captureAll);else if(params.has('profile'))await action(profile);}catch(e){error(e);}
