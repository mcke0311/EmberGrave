}
function drawEnemyLabels(){
 if(!game?.__reviewEnemies||!el('cooldowns').checked)return;
 const canvas=win.document.getElementById('view'),ctx=canvas.getContext('2d'),scale=canvas.width/1920;
 ctx.save();ctx.scale(scale,scale);ctx.font='17px system-ui';ctx.fillStyle='#10141bef';ctx.fillRect(22,22,600,42+game.__reviewEnemies.length*64);ctx.fillStyle='#ead6b1';ctx.fillText('ACT V · ENEMY ATTACK REVIEW',36,50);
 game.__reviewEnemies.forEach((m,i)=>{
  const elem=m.def.meleeElem||m.def.projectile?.elem||'physical';ctx.fillStyle='#f0e7d7';ctx.fillText(`${m.name} · ${m.def.role||'original kit'} · ${elem}`,36,80+i*64);
  const values=[`basic ${Math.max(0,m.attackCd||0).toFixed(1)}s`,...['slam','charge','leap','whirl','volley','summon','heal','tele','throw'].filter(k=>m.def[{summon:'summons',heal:'heals',tele:'teleports',throw:'throwUndead'}[k]||k]).map(k=>`${k} ${Math.max(0,m[k+'Cd']||0).toFixed(1)}s`)];

 });ctx.restore();

async function stageEnemy(id=el('enemy').value,pack=el('pack').value){
 el('enemy').value=id;el('animation').replaceChildren();
 const d5=api.DATA.ENEMIES[id],atlas=api.DATA.SPRITE_MANIFEST.entries['actor.act5.'+(d5.artId||d5.sprite)];
 for(const kind of atlas?.sequences||[])el('animation').add(new Option(kind,kind));
 playing=false;const s=game.state,p=s.player,d=api.DATA.ENEMIES[id],count=pack==='pack'?Math.round(((d.pack||[2,4])[0]+(d.pack||[2,4])[1])/2):1;
 const preferred=reference.composition.landmarks.find(n=>n.id===reference.composition.encounters?.[0]?.landmarkId)||reference.composition.landmarks[1]||map.spawns.default;
 const pockets=[];for(let y=5;y<map.h-5;y++)for(let x=5;x<map.w-5;x++)if(api.TerrainSurface.supported(map,x+.5,y+.5,4.5)&&(!map.bossArena||Math.hypot(x-map.bossArena.cx,y-map.bossArena.cy)>18))pockets.push({x:x+.5,y:y+.5});
 const at=pockets.sort((a,b)=>Math.hypot(a.x-preferred.x,a.y-preferred.y)-Math.hypot(b.x-preferred.x,b.y-preferred.y))[0]||nearest(preferred);
 s.monsters.forEach(m=>m.cancelAttacks?.());s.monsters=[];s.minions=[];s.projectiles=[];s.fx=[];p.dead=false;p.hp=p.stats.maxHp;game.__cinders.place(at.x+3,at.y);win.Math.random=api.U.rng((+el('seed').value)^518);
 for(let i=0;i<count;i++){const pos=nearest({x:at.x-1+(i%2),y:at.y+(i-(count-1)/2)*1.4}),m=new api.Monster(id,pos.x,pos.y);m.aggro=true;s.monsters.push(m);}
 game.__reviewEnemies=s.monsters.slice();game.__cinders.render();el('status').textContent=`Staged ${count} × ${d.name}. Play to fight; Ready specials makes each skill available.`;
 return game.__reviewEnemies;
}
function sampleAnimation(kind=el('animation').value,frame=+el('animationFrame').value){
 playing=false;const m=game.__reviewEnemies?.[0];if(!m)throw Error('Stage an enemy first');
 const A=win.eval('Act5EnemyAnimation'),t=game.state.time;
 m.cancelAttacks();m.dead=false;m.hp=m.maxHp;m.corpseT=0;m.stunT=0;m.frozen=0;m.feared=0;m.action=null;
 if(kind==='death'){
   m.dead=true;const burst=m.def.deathBurst?Math.max(.6,m.def.deathBurst.windup||0):0;
   const age=burst?(frame<3?frame/3*burst:burst+(frame-3)/3*.3):frame/6*.6;
   m.corpseT=12-age-.0001;
 }else{
   m.startAction('attack',1.2,{act5Kind:kind});A.deferred(m,.6);
   const age=frame<3?frame*.2+.01:.6+(frame-3)*.2+.01;m.act5Visual.start=t-age;
   if(frame>=3){m.act5Visual.released=true;m.act5Visual.release=t-(age-.6);}
 }
 game.__cinders.render();return m.pose().ex.act5Animation;
}
function readySpecials(){for(const m of game.__reviewEnemies||[])for(const key of ['slam','charge','leap','whirl','volley','summon','heal','tele','throw'])m[key+'Cd']=0;game.__cinders.render();}
function nearest(p,m=map){
 const points=[];for(let y=1;y<m.h-1;y++)for(let x=1;x<m.w-1;x++)if(api.TerrainSurface.supported(m,x+.5,y+.5,.4))points.push({x:x+.5,y:y+.5});
 return points.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];
}
function pointFor(view){
 if(view==='arrival')return map.spawns.default;
 if(view==='boss'&&map.bossArena)return{x:map.bossArena.cx+2,y:map.bossArena.cy+2};
 if(view==='center')return nearest({x:map.w/2,y:map.h/2});
 const n=reference.composition.landmarks.find(n=>n.id===view);
 if(n?.exit){const e=map.exits.find(e=>e.target===n.exit.target);if(e)return nearest({x:(e.x0+e.x1)/2+(map.id==='hellgate'?-3:3),y:(e.y0+e.y1)/2+3});}
 if(map.composition&&n?.artPosition)return nearest({x:n.artPosition.x+3,y:n.artPosition.y+4});
 return nearest(n||map.spawns.default);
}
function showView(){playing=false;el('play').textContent='Play encounter';const p=pointFor(el('view').value);game.__cinders.place(p.x,p.y);game.__cinders.render();api.UI.refreshHUD();if(win.__errors.length)throw Error(win.__errors.join('\n'));}
function drawTopology(){const c=el('topology');c.width=map.w*3;c.height=map.h*3;const g=c.getContext('2d');g.drawImage(map.minimapBase,0,0,c.width,c.height);for(const ro of map.composition?.routes||[]){g.strokeStyle=ro.optional?'#ddaf62':'#8daeb6';g.lineWidth=2;g.beginPath();ro.points.forEach((p,i)=>i?g.lineTo(p.x*3,p.y*3):g.moveTo(p.x*3,p.y*3));g.stroke();}for(const n of map.composition?.landmarks||[]){g.fillStyle='#e8cf9f';g.beginPath();g.arc(n.x*3,n.y*3,4,0,Math.PI*2);g.fill();}}
async function record(name,body){for(let attempt=0;attempt<3;attempt++)try{const r=await fetch('/api/cinders-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:artifactPrefix+name,...body})});if(!r.ok)throw Error('Artifact recording requires python tests/cinders_server.py');return;}catch(e){if(attempt===2)throw e;await new Promise(resolve=>setTimeout(resolve,1000));}}
async function capture(name){game.__cinders.render();const view=win.document.getElementById('view');await record(name||`${el('zone').value}_${el('width').value}_${el('version').value}_${el('view').value}.webp`,{png:view.toDataURL('image/webp',.94)});}

  el('width').value=width;await load(version,zone);

async function sample(mode){
 const state=game.state,p=state.player,N=api.TerrainNavigation;
 let start=nearest(reference.composition.landmarks[1]||reference.composition.landmarks[0]),travel=null,pocketRadius=3.5;
 if(mode==='moving'){
  const origins=[];for(let y=2;y<map.h-2;y+=2)for(let x=2;x<map.w-2;x+=2)if(api.TerrainSurface.supported(map,x+.5,y+.5,.4))origins.push({x:x+.5,y:y+.5});
  origins.sort((a,b)=>Math.hypot(a.x-map.spawns.default.x,a.y-map.spawns.default.y)-Math.hypot(b.x-map.spawns.default.x,b.y-map.spawns.default.y));
  outer:for(const a of origins)for(const length of [12,8])for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1],[.707,.707],[-.707,.707],[.707,-.707],[-.707,-.707]]){
   const b={x:a.x+dx*length,y:a.y+dy*length};
   if(state.monsters.some(m=>{const t=Math.max(0,Math.min(1,((m.x-a.x)*(b.x-a.x)+(m.y-a.y)*(b.y-a.y))/(length*length)));return Math.hypot(m.x-a.x-(b.x-a.x)*t,m.y-a.y-(b.y-a.y)*t)<8;}))continue;
   if(map.exits.some(e=>Math.min(a.x,b.x)<e.x1+1&&Math.max(a.x,b.x)>e.x0-1&&Math.min(a.y,b.y)<e.y1+1&&Math.max(a.y,b.y)>e.y0-1))continue;
   if(!N.segment(map,a.x,a.y,b.x,b.y,.36))continue;
   start=a;travel={...b,path:[{cx:b.x,cy:b.y,kind:'walk'}]};break outer;
  }
  if(!travel)throw Error('No clear travel profile in '+map.id);
 }
 if(mode==='combat'){
  const pockets=[];
  for(const radius of [3.5,2.5,1.5]){
   for(let y=4;y<map.h-4;y++)for(let x=4;x<map.w-4;x++){
    const a=map.bossArena;if(a&&x>=a.x0-3&&x<=a.x1+3&&y>=a.y0-3&&y<=a.y1+3)continue;
    if(api.TerrainSurface.supported(map,x+.5,y+.5,radius))pockets.push({x:x+.5,y:y+.5});
   }
   if(pockets.length){pocketRadius=radius;break;}
  }
  start=pockets.sort((a,b)=>Math.hypot(a.x-start.x,a.y-start.y)-Math.hypot(b.x-start.x,b.y-start.y))[0];
  if(!start)throw Error('No spacious combat pocket');
 }
 game.__cinders.place(start.x,start.y);p.hp=p.stats.maxHp;state.time=10;
 const routes=[];if(!travel)for(let y=2;y<map.h-2;y+=2)for(let x=2;x<map.w-2;x+=2){const d=Math.hypot(x+.5-start.x,y+.5-start.y);if(d<18||d>30||!api.TerrainSurface.supported(map,x+.5,y+.5,.4))continue;const path=N.findPath(map,p,{x:x+.5,y:y+.5},{radius:.36,speed:4.5});if(path)routes.push({x:x+.5,y:y+.5,path});}
 const destination=travel||routes.sort((a,b)=>a.path.length-b.path.length)[0];if(!destination)throw Error('No representative movement route');
 if(mode==='moving'){p.path=destination.path;p.command={type:'move'};}
 if(mode==='combat'){
  // Exercise this court's actual pack instead of importing distant packs on top of it.
  const nearby=state.monsters.filter(m=>!m.beacon&&!m.encounter&&!m.dead).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,12);
  nearby.sort((a,b)=>Number(!!a.def.projectile)-Number(!!b.def.projectile));
  for(const [i,m] of nearby.entries()){const a=i*Math.PI/6,radius=i===0?1.5:Math.min(3,pocketRadius),pos=nearest({x:p.x+Math.cos(a)*radius,y:p.y+Math.sin(a)*radius});m.x=pos.x;m.y=pos.y;m.aggro=true;m.hp=m.maxHp=Math.max(m.maxHp,100000);}
  if(nearby.length)p.command={type:'attack',target:nearby[0],skill:'basic',hold:true};
 }
 for(let i=0;i<90;i++){game.__cinders.update(1/60);game.__cinders.updateCamera(1/60);game.__cinders.render();if(i%15===0)await raf();}
 const times=[],updateTimes=[],renderTimes=[],intervals=[];let last=performance.now(),distance=0,attackFrames=0,enemyAttackFrames=0,at={x:p.x,y:p.y};
 const before=api.LevelTerrain.getDiagnostics();
 for(let i=0;i<240;i++){
  await raf();const now=performance.now();intervals.push(now-last);last=now;
  if(mode==='moving'&&(!p.path||!p.path.length)){const target=Math.hypot(p.x-start.x,p.y-start.y)<3?destination:start;p.path=N.findPath(map,p,target,{radius:.36,speed:4.5});p.command={type:'move'};}
  const t=performance.now();game.__cinders.update(1/60);game.__cinders.updateCamera(1/60);const u=performance.now();game.__cinders.render();const end=performance.now();times.push(end-t);updateTimes.push(u-t);renderTimes.push(end-u);
  distance+=Math.hypot(p.x-at.x,p.y-at.y);at={x:p.x,y:p.y};
  if(p.action?.state==='attack')attackFrames++;
  enemyAttackFrames+=state.monsters.filter(m=>m.action?.state==='attack').length;

async function profile(){

 }
