<!doctype html><html lang="en"><meta charset="utf-8"><title>Druid transformation gameplay checks</title>
<style>body{background:#17221c;color:#e0dac4;font:14px system-ui;margin:24px}pre{white-space:pre-wrap}iframe{width:100%;height:650px;border:1px solid #53694d}</style>
<h1>Druid transformations in gameplay</h1><p>This temporary hero uses isolated, in-memory saves.</p><pre id="result">Loading…</pre><div id="host"></div>
<script type="module">
const out=document.getElementById('result');window.shiftTestStore=new Map();let checks=0;
const ok=(v,m)=>{checks++;if(!v)throw Error(m);};
try{
  const [html,gameSource,playerSource]=await Promise.all(['../index.html','../js/game.js','../js/player3d.js'].map(p=>fetch(p).then(r=>r.text())));
  // Test-only access to the real game loop and its private presentation snapshot.
  const hookedGame=gameSource.replace('    init, newGame, loadGame,','    __shiftTest:{update,render}, init, newGame, loadGame,');
  const hookedPlayer=playerSource.replace('only3D:true','only3D:true,__shiftFor:p=>shiftFrames.get(p)').replaceAll("import('./","import('./js/");
  const injection=`<base href="${new URL('../index.html',location.href)}"><script>
    const store=parent.shiftTestStore;Object.defineProperty(window,'localStorage',{value:{get length(){return store.size},key:i=>[...store.keys()][i]??null,getItem:k=>store.get(k)??null,setItem:(k,v)=>store.set(String(k),String(v)),removeItem:k=>store.delete(k),clear:()=>store.clear()}});
    window.requestAnimationFrame=()=>0;window.testErrors=[];window.addEventListener('error',e=>testErrors.push(e.message));window.addEventListener('unhandledrejection',e=>testErrors.push(String(e.reason)));
  <\/script>`;
  const iframe=document.createElement('iframe');iframe.title='Druid game under test';
  iframe.srcdoc=html.replace('<head>','<head>'+injection).replace(/<script src="js\/game.js[^\"]*"><\/script>/,()=>'<script>'+hookedGame+'<\/script>').replace(/<script src="js\/player3d.js[^\"]*"><\/script>/,()=>'<script>'+hookedPlayer+'<\/script>');
  document.getElementById('host').append(iframe);await new Promise(r=>iframe.onload=r);
  const win=iframe.contentWindow,game=win.eval('Game'),data=win.eval('DATA'),ui=win.eval('UI');
  for(let n=0;n<500&&!win.document.querySelector('#titleMenu button');n++)await new Promise(r=>setTimeout(r,20));
  ok(!!win.document.querySelector('#titleMenu button'),'game startup did not finish');
  await game.newGame('Druid review','wildkeeper',false);await (await import('/tests/completed_hero_fixture.mjs')).loadCompletedHero(game);game.state.flags.seenIntro=true;ui.closeAll();
  const p=game.state.player,api=game.__shiftTest,view=win.Player3D;
  const step=(seconds)=>{for(let i=0;i<Math.ceil(seconds*60);i++)api.update(1/60);api.render();};
  p.command=null;step(.1);ok(!view.__shiftFor(p),'new hero replayed shift');
  const skills=Object.values(data.SKILLS).filter(s=>s.type==='form');ok(skills.length===4,'four live shape skills missing');
  for(const skill of skills){
    p.skills[skill.id]=1;p.mana=p.stats.maxMana;p.action=null;
    const oldVisual=p._playerVisual,position=[p.x,p.y],mana=p.mana;
    ok(p.performSkill(skill.id,null,null),'form cast rejected: '+skill.name);
    ok(p.form===skill.form&&p.mana<mana,'form did not apply and charge mana immediately');
    step(1/60);let shift=view.__shiftFor(p);
    ok(shift&&shift.from===null&&shift.to==='form_'+skill.form,'missing entry animation: '+skill.name);
    ok(p.x===position[0]&&p.y===position[1],'shift moved player');
    const snapshot=JSON.stringify(shift);for(let n=0;n<8;n++)api.render();
    ok(JSON.stringify(view.__shiftFor(p))===snapshot,'render advanced transition');
    step(.45);ok(view.__shiftFor(p)?.t>0&&view.__shiftFor(p)?.t<1,'no intermediate transform frames');
    step(.8);ok(!view.__shiftFor(p)&&p._formVisual?.form==='form_'+skill.form,'entry did not finish');
    p.mana=p.stats.maxMana;ok(p.performSkill(skill.id,null,null),'revert rejected');step(1/60);
    ok(view.__shiftFor(p)?.from==='form_'+skill.form&&view.__shiftFor(p)?.to===null,'missing reversion animation');
    step(1.2);ok(!view.__shiftFor(p)&&!p._formVisual&&p._playerVisual===oldVisual,'reversion lost equipment');
  }
  // Rapid direct changes exercise different leg counts while both layers render.
  for(const skill of [...skills,...skills].reverse()){p.mana=p.stats.maxMana;p.performSkill(skill.id,null,null);step(.12);}
  ok(win.testErrors.length===0&&!win.document.getElementById('appFatal'),'render failed during rapid shifts: '+win.testErrors.join(', '));
  game.saveGame();const saved=[...window.shiftTestStore.values()].join('');
  ok(!saved.includes('wildshape')&&!saved.includes('shiftFrames'),'presentation state leaked into saves');
  p.dead=true;step(1/60);ok(!view.__shiftFor(p),'death did not cancel shift');p.dead=false;p.buffs=[];p.form=null;step(1.3);
  out.textContent=`PASS · ${checks} real skill, reversion, gameplay timing, render purity, rapid-change, death and equipment checks.`;document.body.dataset.testStatus='passed';
}catch(e){out.textContent='FAIL · '+e.stack;document.body.dataset.testStatus='failed';}
</script></html>
