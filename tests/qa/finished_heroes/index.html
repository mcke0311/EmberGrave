<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embergrave character review</title>
<style>
  :root{color-scheme:dark;font:16px/1.45 system-ui,sans-serif;background:#17191d;color:#ede6db}
  *{box-sizing:border-box}body{max-width:1536px;margin:auto;padding:clamp(14px,3vw,48px)}
  h1{font:normal clamp(1.8rem,4vw,3rem) Georgia,serif;margin:0 0 1rem}
  form{display:flex;flex-wrap:wrap;gap:.7rem 1rem;margin:0 0 1rem}
  label{display:grid;gap:.25rem;color:#c7b9a8;font-size:.83rem}
  select{background:#292a2e;border:1px solid #675d50;color:#fff2dc;padding:.5rem .8rem;border-radius:4px;font:inherit;font-size:.97rem}
  [hidden]{display:none!important}p{color:#c7bfb2;margin:.6rem 0 1rem}
  .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.25rem 1rem}
  .wide{grid-template-columns:1fr}figure{margin:0 0 1rem;background:#24262a}figcaption{padding:.45rem .7rem}
  img{display:block;max-width:100%;height:auto;margin:auto}a{color:#e3c298}footer{margin-top:1.2rem;display:flex;flex-wrap:wrap;gap:.6rem 1.4rem}
  @media(max-width:820px){.pair{grid-template-columns:1fr}}
</style>
<h1>Embergrave character review</h1>
<form>
  <label>View<select id="mode"><option value="world">Opening road and mines</option><option value="ranks">Armor ranks</option><option value="forms">Wildkeeper forms</option><option value="armory">Starter armory</option><option value="fit">Close fittings</option></select></label>
  <label id="heroLabel">Hero<select id="hero"></select></label>
  <label id="formLabel" hidden>Form<select id="form"></select></label>
  <label id="rankLabel" hidden>Armor rank<select id="rank"><option value="0">Field</option><option value="4">Reinforced</option><option value="7">Veteran</option><option value="13">Mythic</option></select></label>
  <label id="zoneLabel">Location<select id="zone"><option value="frosthaven">Frosthaven</option><option value="mines">Abandoned Mines</option></select></label>
  <label id="screenLabel">Viewport<select id="screen"><option value="1920">1920 × 1080 desktop</option><option value="844">844 × 390 landscape phone</option></select></label>
  <label id="fitLabel" hidden>Subject<select id="subject"><option value="hero">Hero</option><option value="form">Transformation</option></select></label>
</form>
<p id="caption"></p>
<main id="pictures" class="pair"></main>
<footer>
  <a href="heroes.webp">All five heroes</a><a href="mythic-in-play.webp">Mythic armor at gameplay zoom</a><a href="forms.webp">All four forms</a>
  <a href="gameplay-1920.webp">Desktop gameplay crops</a><a href="gameplay-844.webp">Phone gameplay crops</a>
  <a href="verification.json">Verification results</a>
</footer>
<script>
  const el=id=>document.getElementById(id),heroes={vanguard:'Vanguard',emberwitch:'Ember Witch',gravebinder:'Gravebinder',wildkeeper:'Wildkeeper',veilranger:'Veil Ranger'};
  const forms={form_fang:'Wolf Form',form_brute:'Bear Form',form_stone:'Stone Form',form_apex:'Wrath of the Wild'};
  for(const [target,options] of [['hero',heroes],['form',forms]])for(const [key,name] of Object.entries(options))el(target).add(new Option(name,key));
  function show(){
    const mode=el('mode').value,fit=mode==='fit',form=mode==='forms'||fit&&el('subject').value==='form',world=mode==='world';
    for(const [id,visible] of Object.entries({hero:!form,form,rank:mode==='ranks',zone:world,screen:world,fit}))el(id+'Label').hidden=!visible;
    const hero=el('hero').value,beast=el('form').value,r=el('rank').value;
    const key=world?[el('zone').value,el('screen').value,hero].join('-'):form?beast:mode==='ranks'?hero+'-t'+r:fit?hero:'armory-'+hero;
    const name=form?forms[beast]:heroes[hero],pictures=el('pictures');
    pictures.classList.toggle('wide',mode==='ranks'||form||fit);pictures.replaceChildren();
    el('caption').textContent=world?'Both frames use the same map seed, camera position and gameplay zoom. Select a frame to open it at its original size.':
      mode==='armory'?'The starter, its rear view and a reinforced helmet on the same outfit.':
      fit?(form?'Face, moving jaw, paw and back.':'Top row shows the face, profile, open helmet and rear headgear. Bottom row shows the grip, cuff, boot and waistband.'):
      'Eight directions in gameplay lighting. The third view faces the camera and the seventh faces away.';
    for(const [phase,title] of (fit?[['details','Finished fittings']]:[['before','Painted baseline'],['after','Finished']])){
      const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),img=new Image();
      c.textContent=title+' · '+name;a.href=phase+'/'+key+'.webp';img.alt=c.textContent;img.src=a.href;
      a.append(img);f.append(c,a);pictures.append(f);
    }
  }
  document.querySelector('form').addEventListener('change',show);show();
</script>
</html>
