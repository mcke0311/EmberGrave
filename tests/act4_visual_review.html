<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Act IV — The Shattered Cathedral</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#dfded7;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:24px 4vw;border-bottom:1px solid #343944}.title{flex:1}small{color:#ad9670;text-transform:uppercase;letter-spacing:.24em;font-size:10px}h1{font:30px Georgia;margin:4px 0}p{margin:0;color:#939dac}select,a{border:1px solid #444b57;background:#171d27;color:#e0ddd4;border-radius:4px;padding:10px 14px;font:inherit}a{text-decoration:none}main{max-width:1920px;margin:auto}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#080a10}.stage img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain}#after{clip-path:inset(0 0 0 50%)}#line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#d6c299;pointer-events:none}#line:after{content:'↔';position:absolute;top:50%;left:-20px;width:40px;height:40px;border-radius:50%;background:#121925e8;border:1px solid #ad9670;display:grid;place-items:center;font-size:23px}#wipe{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}.tag{position:absolute;top:18px;padding:5px 12px;background:#0a0d13c9;border:1px solid #3c414b;color:#c9c8c1;letter-spacing:.12em;font-size:10px;text-transform:uppercase;pointer-events:none}.old{left:20px}.new{right:20px}footer{padding:20px 4vw;display:flex;gap:24px;align-items:center;flex-wrap:wrap}footer p{flex:1}button{background:transparent;color:#d1b989;border:0;font:inherit;cursor:pointer;padding:8px}button:hover,a:hover{color:white}select{max-width:100%}@media(max-width:800px){header{gap:14px;padding:18px}h1{font-size:25px}.title{flex-basis:100%}footer{padding:14px}.tag{top:8px}}
</style>
<header><div class="title"><small>Embergrave · Act IV</small><h1>The Shattered Cathedral</h1><p>Stone, firelight, and borrowed memories.</p></div><select id="scene" aria-label="Choose a scene"></select><a id="play" href="cathedral_review.html">Explore Act IV ↗</a></header>
<main><div class="stage"><img id="before" alt="Act IV before the visual pass"><img id="after" alt="Act IV after the visual pass"><div id="line"></div><span class="tag old">Before</span><span class="tag new">After</span><input id="wipe" type="range" min="0" max="100" value="50" aria-label="Drag to compare before and after"></div></main>
<footer><p>Drag across the scene to compare. Captured in the game with the same map and camera.</p><button id="original">Show before</button><button id="updated">Show after</button><a id="full" href="#">Open full image ↗</a></footer>
<script>
const scenes=[['cathedral1','arrival','Arrival bridge'],['cathedral1','nave','Nave of borrowed memories'],['cathedral1','cinderwatch','Cinderwatch chapel'],['cathedral1','boss','The Empty Archangel'],['cathedral2','arrival','The reliquary threshold'],['cathedral2','ritual_0','Choir of silence'],['cathedral2','boss','The Hollow King'],['cathedral_cinderwatch','arrival','The ember gate'],['cathedral_cinderwatch','memory','Houses without names'],['cathedral_cinderwatch','sanctuary','The watch captain’s square'],['cathedral_bastion','arrival','The shattered portcullis'],['cathedral_bastion','memory','The abandoned muster'],['cathedral_bastion','sanctuary','The last defense']];
const $=id=>document.getElementById(id);scenes.forEach((s,i)=>$('scene').add(new Option(s[2],i)));$('scene').value=1;
function wipe(value){$('wipe').value=value;$('after').style.clipPath=`inset(0 0 0 ${value}%)`;$('line').style.left=value+'%';}
function show(){const [zone,view]=scenes[+$('scene').value];for(const phase of ['before','after'])$(phase).src=`qa/act4_visual/${phase}_${zone}_${view}.webp`;$('play').href=`cathedral_review.html?zone=${zone}&view=${view}`;$('full').href=$('after').src;}
$('scene').onchange=show;$('wipe').oninput=e=>wipe(e.target.value);$('original').onclick=()=>wipe(100);$('updated').onclick=()=>wipe(0);show();
</script>
</html>
