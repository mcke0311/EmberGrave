<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Act IV · Stone and memory</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1017;color:#e3e5e9;font:14px/1.5 system-ui}header,footer{max-width:1560px;margin:auto;padding:24px 32px}header{display:flex;align-items:end;justify-content:space-between;gap:24px}small{color:#af986d;letter-spacing:.2em;font-size:11px}h1{font:36px Georgia,serif;margin:6px 0}p{color:#a6afbc;margin:6px 0}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}a{color:#c6d6e6;text-decoration:none;border-bottom:1px solid #64788d}select,button{background:#19222e;border:1px solid #3c4858;color:#e4e7eb;border-radius:5px;padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{background:#2b3848}.scene{position:relative;max-width:1600px;margin:auto;aspect-ratio:16/9;background:#080b10;overflow:hidden;border:1px solid #303a48}.scene img{position:absolute;width:100%;height:100%;object-fit:contain}#line{position:absolute;top:0;bottom:0;width:1px;background:#ecd9ad;pointer-events:none;left:100%}footer{display:flex;align-items:center;gap:18px;padding-top:18px}input{flex:1;accent-color:#b9a378;min-width:80px}#caption{min-width:180px;color:#acb6c4}#error{color:#ffae9d}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #d8b97d;outline-offset:4px}@media(max-width:800px){nav,select{max-width:100%}header{align-items:start;flex-direction:column;padding:18px}h1{font-size:29px}footer{padding:18px;flex-wrap:wrap}#caption{width:100%}}
</style></head><body>
<header><div><small>EMBERGRAVE / ACT IV</small><h1>Stone and memory</h1><p>Rebuilt paving, connected masonry, cold window light and the warmth of ruined hearths.</p></div><nav><select id="scene" aria-label="Choose location"></select><a id="play" href="cathedral_review.html">Play this location ↗</a></nav></header>
<main class="scene"><img id="before" alt="Act IV before this visual rebuild"><img id="after" alt="Act IV after this visual rebuild"><div id="line"></div></main>
<footer><button id="old">Before</button><input id="wipe" type="range" min="0" max="100" value="100" aria-label="Show more of the rebuilt scene"><button id="new">After</button><button id="compare">Compare</button><span id="caption">Rebuilt scene</span><a id="full" href="#">Full size ↗</a></footer><p id="error" role="alert"></p>
<script type="module">
const $=id=>document.getElementById(id),scenes=[
 ['cathedral1','nave','The Shattered Cathedral · Nave'],['cathedral1','arrival','The Shattered Cathedral · Arrival'],['cathedral1','karrhal','The Shattered Cathedral · Mountain chapel'],['cathedral1','cinderwatch','The Shattered Cathedral · Cinderwatch chapel'],['cathedral1','boss','The Shattered Cathedral · Empty Archangel'],
 ['cathedral2','arrival','The Cathedral Heart · Threshold'],['cathedral2','ritual_0','The Cathedral Heart · Choir of silence'],['cathedral2','ritual_1','The Cathedral Heart · Armory'],['cathedral2','boss','The Cathedral Heart · Malthoron'],
 ['cathedral_cinderwatch','arrival','Cinderwatch Remembered · Ember gate'],['cathedral_cinderwatch','memory','Cinderwatch Remembered · Houses without names'],['cathedral_cinderwatch','sanctuary','Cinderwatch Remembered · Captain’s square'],
 ['cathedral_bastion','arrival','The Last Bastion · Portcullis'],['cathedral_bastion','memory','The Last Bastion · Muster'],['cathedral_bastion','sanctuary','The Last Bastion · Final defense']];
for(const [i,scene]of scenes.entries())$('scene').add(new Option(scene[2],i));
function wipe(value=$('wipe').value){$('wipe').value=value;$('after').style.clipPath=`inset(0 ${100-value}% 0 0)`;$('line').style.left=value+'%';$('caption').textContent=value==100?'Rebuilt scene':value==0?'Original scene':'After ← drag → Before';}
async function show(){const [zone,view]=scenes[+$('scene').value];$('error').textContent='';for(const phase of ['before','after'])$(phase).src=`qa/act4_rebuild/${phase}_${zone}_${view}.webp`;$('play').href=`cathedral_review.html?zone=${zone}&view=${view}`;$('full').href=$('after').src;try{await Promise.all(['before','after'].map(id=>$(id).decode()));document.body.dataset.ready='true';}catch{$('error').textContent='Scene images are unavailable. Run the Act IV capture script.';}}
$('scene').onchange=show;$('wipe').oninput=()=>wipe();$('old').onclick=()=>wipe(0);$('new').onclick=()=>wipe(100);$('compare').onclick=()=>wipe(50);wipe();await show();
</script></body></html>
