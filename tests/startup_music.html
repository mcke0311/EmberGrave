<!doctype html><html lang="en"><meta charset="utf-8"><title>Startup music check</title>
<style>body{background:#131923;color:#ddd3bf;font:14px system-ui;margin:20px}button{padding:10px 18px}pre{white-space:pre-wrap}iframe{width:100%;height:660px;border:1px solid #67563e}</style>
<h1>Recorded soundtrack and UI sound</h1><p>Isolated game preview; your real saves are never accessed.</p><button id="run" disabled>Run playback checks</button><pre id="result">Loading…</pre><div id="host"></div>
<script type="module">
const store=new Map();window.musicTestStore=store;
const source=await fetch('../index.html',{cache:'no-store'}).then(r=>r.text()),frame=document.createElement('iframe');frame.title='Isolated startup music preview';
const injection=`<base href="${new URL('../index.html',location.href)}"><script>
const saved=parent.musicTestStore;Object.defineProperty(window,'localStorage',{value:{get length(){return saved.size},key:i=>[...saved.keys()][i]??null,getItem:k=>saved.get(k)??null,setItem:(k,v)=>saved.set(String(k),String(v)),removeItem:k=>saved.delete(k),clear:()=>saved.clear()}});
window.audioErrors=[];window.addEventListener('unhandledrejection',e=>audioErrors.push(String(e.reason)));
<\/script>`;
frame.srcdoc=source.replace('<head>','<head>'+injection);document.getElementById('host').append(frame);await new Promise(r=>frame.onload=r);
const win=frame.contentWindow,doc=win.document,out=document.getElementById('result'),run=document.getElementById('run');
const delay=ms=>new Promise(r=>setTimeout(r,ms));async function until(fn,label){for(let i=0;i<400;i++){if(fn())return;await delay(50);}throw Error('Timed out: '+label);}
let checks=0;function ok(pass,label){checks++;if(!pass)throw Error(label);}
await until(()=>doc.getElementById('titleMusic'),'title track created');out.textContent='Ready. Click Run playback checks to verify real MP3 playback.';run.disabled=false;
run.onclick=async()=>{
 run.disabled=true;out.textContent='Checking playback, looping, volume, class selection, and gameplay handoff…';
 const sfx=win.eval('Sfx'),ui=win.eval('UI'),track=doc.getElementById('titleMusic');
 try{
  await sfx.init();sfx.setVol('master',.5);sfx.setVol('music',.4);
  doc.dispatchEvent(new win.Event('pointerdown',{bubbles:true}));
  await until(()=>!track.paused&&track.currentTime>.1&&Number.isFinite(track.duration),'MP3 decoding and playback');
  ok(decodeURI(new URL(track.currentSrc).pathname).endsWith('/assets/music/Black Rune Oath.mp3'),'wrong startup song');
  ok(track.duration>30&&!track.error,'MP3 did not decode');ok(track.loop,'title song does not loop');
  ok(Math.abs(track.volume-.2)<.0001,'master and music volumes were not combined');
  const before=track.currentTime;await delay(180);ok(track.currentTime>before,'playback clock did not advance');
  [...doc.querySelectorAll('#titleMenu button')].find(b=>b.textContent==='SINGLE PLAYER').click();await delay(120);
  ok(!track.paused&&track.currentTime>=before,'class selection interrupted the song');
  sfx.music('title');ok(doc.querySelectorAll('#titleMusic').length===1&&track.currentTime>=before,'repeated title music restarted or duplicated audio');
  sfx.setVol('music',0);ok(track.volume===0,'music mute failed');sfx.setVol('music',.4);
  track.currentTime=track.duration-.2;await until(()=>track.currentTime<2&&!track.paused,'track loop at end');ok(!track.ended,'loop left the track ended');
  ui.hideTitle();ok(track.paused&&track.currentTime===0,'leaving title did not stop and reset the song');
  sfx.music('town');doc.dispatchEvent(new win.Event('pointerdown',{bubbles:true}));ok(track.paused,'stale title gesture replaced gameplay music');
  ui.showTitle();await until(()=>!track.paused&&track.currentTime>.05,'return to title');ok(!track.paused,'returning to title did not resume song');
  // Also exercise a programmatic transition before the newly registered unlock gesture.
  ui.hideTitle();sfx.music('wild');doc.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Shift',bubbles:true}));ok(track.paused,'hidden title retained its keyboard unlock listener');
  ok(store.size===0,'music test wrote a hero save');ok(win.audioErrors.length===0&&!doc.getElementById('appFatal'),'runtime failure');
  const data=win.eval('DATA');
  for(const id of ['frosthaven','north_wild','mines','shattered_temple','shardpeak_shrine','deepfreeze_cavern']){
    const key=data.ZONES[id].musicTrack;ok(key===(id==='frosthaven'?'frosthaven':'fallenNorth'),id+': wrong music assignment');
  }
  sfx.music('frosthaven');const town=doc.getElementById('music-frosthaven');
  await until(()=>!town.paused&&town.currentTime>.1&&Number.isFinite(town.duration),'town MP3 playback');
  ok(decodeURI(new URL(town.currentSrc).pathname).endsWith('/assets/music/Snowy Mountain Vigil.mp3')&&town.loop,'wrong town track or looping');
  sfx.music('fallenNorth');const north=doc.getElementById('music-fallenNorth');
  await until(()=>!north.paused&&north.currentTime>.1&&Number.isFinite(north.duration)&&town.paused,'north MP3 playback and fade');
  const position=north.currentTime;sfx.music('fallenNorth');await delay(100);ok(north.currentTime>=position,'same-region transition restarted music');
  ok(decodeURI(new URL(north.currentSrc).pathname).endsWith('/assets/music/White Breath, Iron Sky.mp3')&&north.loop,'wrong wilderness track or looping');
  sfx.setVol('master',.5);sfx.setVol('music',.4);ok(Math.abs(north.volume-.2)<.0001,'gameplay volume mismatch');
  sfx.setVol('music',0);ok(north.volume===0,'gameplay mute failed');sfx.setVol('music',.4);
  north.currentTime=north.duration-.2;await until(()=>north.currentTime<2&&!north.paused,'north track loop');
  sfx.music('frosthaven');sfx.music('fallenNorth');sfx.music('frosthaven');await delay(600);
  ok(!town.paused&&north.paused&&track.paused,'rapid transitions left stale playback');
  sfx.music('dungeon');ok(town.paused&&north.paused,'synthesized region overlaps recorded music');
  sfx.music('title');await until(()=>!track.paused,'return to title after Act 1');ok(town.paused&&north.paused,'title overlaps gameplay music');
  ok(doc.querySelectorAll('audio').length===3,'duplicate recorded players');
  const assigned={marshTown:['marshcamp'],marsh:['weeping_marsh','drowned_crypt','ritual_site','hollow_reeds','spawn_pools'],desertTown:['khalcamp'],desert:['desert_wastes','sand_tombs','khal_palace','shard_flats','tomb_sanctum'],cathedral:['cathedral1','cathedral2'],breach:['hellgate'],cinders:['ash_wastes','cinder_bastion','throne']};
  const files={marshTown:'Dusk in the Empty Town.mp3',marsh:'Ash Dune Cathedral.mp3',desertTown:'Dusk in the Demonic Jungle.mp3',desert:'Sombras del Infierno.mp3',infernalTown:'Infernal Town at Dusk.mp3',cathedral:'Infernal Silence.mp3',breach:'Tour de Pierre Vieille.mp3',cinders:'Ancient Tower.mp3',cavernsOfShadow:'Caverns of Shadow.mp3',cavernsHeart:"Cavern's Heart.mp3",caveEchoes:'Cave Echoes.mp3',boss:'Hellscape Assault.mp3'};
  for(const [key,filename] of Object.entries(files)){
    ok(sfx.TRACKS[key]===filename,key+': wrong centralized filename');
    for(const zone of assigned[key]||[])ok(data.ZONES[zone].musicTrack===key,zone+': wrong track');
    sfx.music(key);const player=doc.getElementById('music-'+key);
    await until(()=>!player.paused&&player.currentTime>.1&&Number.isFinite(player.duration)&&[...doc.querySelectorAll('audio')].every(a=>a===player||a.paused),key+' real playback and fade');
    ok(decodeURI(new URL(player.currentSrc).pathname).endsWith('/assets/music/'+filename)&&!player.error&&player.duration>30&&player.loop,key+': loading or looping failed');
    ok(Math.abs(player.volume-.2)<.0001,key+': volume failed');
    const position=player.currentTime;
    for(const zone of assigned[key]||[])sfx.music(data.ZONES[zone].musicTrack);
    await delay(100);ok(player.currentTime>=position,key+': same-song zone change reset position');
    player.currentTime=player.duration-.2;await until(()=>player.currentTime<2&&!player.paused,key+' end loop');
    ok(!player.ended,key+': ended rather than looped');
  }
  for(const key of ['marsh','desertTown','cathedral','marshTown','infernalTown','desert','breach','cinders','breach','cinders'])sfx.music(key);
  await delay(650);ok([...doc.querySelectorAll('audio')].filter(a=>!a.paused).map(a=>a.id).join()==='music-cinders','rapid new-track transitions left overlapping playback');
  for(const zone of ['town','fields','crypt1'])ok(!data.ZONES[zone].musicTrack,zone+': unspecified soundtrack changed');
  sfx.music('dungeon');ok([...doc.querySelectorAll('audio')].every(a=>a.paused),'synth fallback overlaps a new recording');
  ui.showTitle();await until(()=>!track.paused&&[...doc.querySelectorAll('audio')].every(a=>a===track||a.paused),'title return after later acts');
  ok(doc.querySelectorAll('audio').length===Object.keys(sfx.TRACKS).length,'new tracks duplicated players');
  ok(win.audioErrors.length===0,'new audio produced an unhandled rejection');
  sfx.stopMusic();out.textContent=`PASS — ${checks} checks. Real MP3 decoded (${track.duration.toFixed(1)} seconds), playback advances, end-of-track looping, master/music volume and mute, continuous class-selection music, gameplay handoff, return to title, no stale gesture or duplicate player. Act 1–5 regional assignments and all ${Object.keys(sfx.TRACKS).length} MP3s including exploration and boss tracks, same-track continuity, rapid transitions, looping, volume and fallback ambience verified. Real saves untouched.`;
 }catch(error){sfx.stopMusic();out.textContent='FAIL: '+error.stack;}
};
</script></html>
