<!doctype html><html lang="en"><meta charset="utf-8"><title>Embergrave — Playable terrain review</title>
<style>body{margin:0;background:#12191b;color:#e6dac3;font:14px/1.5 system-ui}header{padding:20px 3vw}h1{font:28px Georgia;margin:0}select{padding:8px;background:#253234;color:#eed8b2;font:inherit}iframe{display:block;width:100%;height:800px;border:0}#result{color:#a5d2ae}#error{color:#ff927c;white-space:pre-wrap}</style>
<header><h1>Explore the other levels</h1><p>Review character uses temporary saves.</p><label>Level <select id="level" disabled></select></label><p id="result">Loading live terrain checks…</p><pre id="error"></pre></header><main id="host"></main>
<script type="module">
window.levelReviewStore=new Map();const select=document.getElementById('level'),out=document.getElementById('result');
try{
 const source=await fetch('../index.html',{cache:'no-store'}).then(r=>r.text());
 const injection=`<base href="${new URL('../index.html',location.href)}"><script>const store=parent.levelReviewStore;Object.defineProperty(window,'localStorage',{value:{get length(){return store.size},key:i=>[...store.keys()][i]??null,getItem:k=>store.get(k)??null,setItem:(k,v)=>store.set(String(k),String(v)),removeItem:k=>store.delete(k),clear:()=>store.clear()}});window.addEventListener('error',e=>parent.document.getElementById('error').textContent=e.message);<\/script>`;
 const frame=document.createElement('iframe');frame.title='Playable level review';frame.srcdoc=source.replace('<head>','<head>'+injection);document.getElementById('host').append(frame);await new Promise(r=>frame.onload=r);
 const win=frame.contentWindow,doc=win.document;for(let i=0;i<300&&!doc.querySelector('#titleMenu button');i++)await new Promise(r=>setTimeout(r,30));
 const game=win.eval('Game'),ui=win.eval('UI'),data=win.eval('DATA');win.eval('Sfx').setVol('master',0);await game.newGame('Terrain review','vanguard',false);await game.skipOpening();ui.closeAll();
 const ids=Object.keys(data.ZONES).filter(id=>!['town','camp'].includes(data.ZONES[id].kind));let checked=0;
 async function visit(id){
  ui.closeAll();if(!await game.enterMap(id,'default'))throw Error(id+' failed map entry');game.state.monsters=[];game.state.map.explored.fill(1);game.state.player.hp=game.state.player.stats.maxHp;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  if(doc.querySelector('#appFatal'))throw Error(id+' '+doc.querySelector('#appFatalDetail')?.textContent);
  if(document.getElementById('error').textContent)throw Error(document.getElementById('error').textContent);
 }
 for(const id of ids){select.add(new Option(data.ZONES[id].name,id));await visit(id);checked++;out.textContent=`Checking live scene ${checked}/${ids.length}`;}
 await visit('north_wild');select.value='north_wild';select.disabled=false;out.textContent=`PASS · All ${checked} non-town levels entered and rendered in the running game.`;
 select.onchange=async()=>{select.disabled=true;try{await visit(select.value)}catch(e){out.textContent='FAIL · '+e.message}finally{select.disabled=false}};
}catch(e){out.textContent='FAIL · '+e.message;document.getElementById('error').textContent=e.stack;}
</script></html>
