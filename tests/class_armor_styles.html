<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embergrave — Class armor styles</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121217;color:#ddd4c7;font:14px/1.5 system-ui}main{max-width:1450px;margin:auto;padding:30px}h1{font:36px Georgia;margin:10px 0}h2{font:22px Georgia;margin:30px 0 12px}p{color:#a69d9a}a{color:#dab07e}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{border:1px solid #343438;border-radius:8px;background:radial-gradient(ellipse at 50% 35%,#292c2e,#19191f 72%);overflow:hidden}.card h3{font:18px Georgia;margin:14px 16px 0}.card p{font-size:11px;margin:0 16px 12px}canvas{display:block;width:100%;height:auto}#result{font-size:12px;color:#a9b4a2}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px}}</style></head>
<body><main><a href="three_character.html">← Back to the interactive armory</a><h1>Five classes. Five armor traditions.</h1><p>The same equipment tiers, interpreted for each class. Shown without weapons so the clothing and armor are visible.</p><div id="result" role="status">Preparing armor…</div><div id="lineups"></div></main>
<script src="../js/utils.js"></script><script src="../js/data.js"></script><script>window.StyleData=DATA;</script><script type="module">
import {CLASS_STYLES,resolveCharacterVisual} from '../js/character_catalog3d.mjs';
import {ARMOR_LEVELS,armorRank} from '../js/character_armor3d.mjs?v=4';
import {createCharacterRenderer} from '../js/character3d.mjs?v=5';
const output=document.getElementById('result'),data=window.StyleData;let view;
try{
  view=createCharacterRenderer({size:512});view.camera.left=-1.35;view.camera.right=1.35;view.camera.top=1.35;view.camera.bottom=-1.35;view.camera.updateProjectionMatrix();
  for(const [tier,label] of [[0,'I · Field clothing'],[4,'II · Reinforced'],[7,'III · Veteran'],[13,'IV · Mythic']]){
    const heading=document.createElement('h2');heading.textContent=label;document.getElementById('lineups').append(heading);
    const grid=document.createElement('div');grid.className='grid';document.getElementById('lineups').append(grid);
    for(const [id,profile] of Object.entries(CLASS_STYLES)){
      const equip=Object.fromEntries(['head','chest','gloves','boots','belt'].map(slot=>[slot,{baseId:(slot==='head'?'helm':slot)+'_t'+tier}]));
      const v=resolveCharacterVisual(data,id,equip),card=document.createElement('article');card.className='card';
      const title=document.createElement('h3');title.textContent=profile.name;const subtitle=document.createElement('p');subtitle.textContent=ARMOR_LEVELS[id][armorRank(v.equipment.chest)];
      const canvas=document.createElement('canvas');canvas.width=canvas.height=512;canvas.setAttribute('aria-label',profile.name+' '+label+' armor');
      const ctx=canvas.getContext('2d');ctx.drawImage(view.render({state:'idle',t:0,ang:Math.PI*.39},v.equipment,id),0,0);
      card.append(title,canvas,subtitle);grid.append(card);
    }
    await new Promise(resolve=>setTimeout(resolve,0));
  }
  output.textContent='20 outfits · five classes across four equipment tiers';document.body.dataset.testStatus='passed';
}catch(error){output.textContent=error.stack;document.body.dataset.testStatus='failed';}finally{view?.dispose();}
</script></body></html>
